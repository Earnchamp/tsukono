<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldPay Admin Login</title>
<style>
:root{--navy:#111a36;--blue:#087bd1;--bg:#eef1f6;--muted:#78849a;--line:#dfe4ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111a36 0%,#1d3158 58%,#087bd1 140%);font:15px Inter,"Segoe UI",system-ui,Arial,sans-serif;color:#26334d;padding:20px}
.card{width:min(420px,100%);background:#fff;border-radius:7px;box-shadow:0 18px 60px #07132c66;overflow:hidden}.brand{background:var(--navy);color:#fff;padding:25px 30px}.brand h1{font-size:25px;margin:0;font-weight:850}.brand h1 span{color:#62b8ff}.brand p{margin:8px 0 0;color:#c3cde0;font-size:13px}.body{padding:30px}.body h2{margin:0 0 7px;font-size:21px;color:#25334d}.sub{margin:0 0 23px;color:var(--muted);font-size:13px}label{display:block;margin:15px 0 7px;font-weight:700;font-size:13px}input{width:100%;padding:13px;border:1px solid #d8dfeb;border-radius:3px;font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #087bd122}.btn{width:100%;margin-top:22px;padding:13px;background:var(--blue);color:#fff;border:0;border-radius:3px;font-weight:800;font-size:15px;cursor:pointer}.error{color:#c32d3d;font-size:13px;min-height:18px;margin:12px 0 0}.foot{background:#f5f7fa;border-top:1px solid var(--line);padding:14px 30px;color:#78849a;font-size:11px;line-height:1.5}.demo{margin-top:17px;padding:12px;background:#f1f6fc;border-left:3px solid var(--blue);font-size:12px;color:#41516b}.demo b{color:#25334d}
</style>
<script src="auth.js"></script>
</head>
<body>
<div class="card">
  <div class="brand"><h1>Gold<span>Pay</span></h1><p>Administration Portal</p></div>
  <div class="body">
    <h2>Admin sign in</h2><p class="sub">Enter your administrator credentials to access the dashboard.</p>
    <form id="loginForm">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" required placeholder="Enter username">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
      <button class="btn" type="submit">Sign in</button><p class="error" id="loginError" role="alert"></p>
    </form>
    <div class="demo"><b>Demo credentials</b><br>Username: <b>admin</b><br>Password: <b>GoldPay@2026</b></div>
  </div>
  <div class="foot">Demo access gate only. Do not use real customer, payment, or financial data in this static demo.</div>
</div>
</body></html>
